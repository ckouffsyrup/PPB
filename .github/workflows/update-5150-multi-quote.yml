name: PrintBook 5.15 multi-item quoting
on:
  push:
    paths: ['.github/workflows/update-5150-multi-quote.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/update_5150_multi_quote.py
      - name: Validate JS
        run: node --check app.js
      - name: Verify quoting UI
        run: |
          grep -q 'data-line-unit-price' app.js
          grep -q 'orderLineItemsQuoteTotal' index.html
          grep -q 'PRINTBOOK_BUILD="5.15.0"' app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html storefront-v55.css sw.js
          git commit -m "PrintBook 5.15 multi-item quoting"
          git push

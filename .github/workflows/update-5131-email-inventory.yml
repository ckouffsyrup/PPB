name: PrintBook 5.13.1 email + inventory fix

on:
  push:
    paths:
      - '.github/workflows/update-5131-email-inventory.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PrintBook 5.13.1 patch
        run: python .github/scripts/update_5131_email_inventory.py
      - name: Validate JavaScript
        run: node --check app.js && node --check sw.js
      - name: Validate email helper
        run: |
          node - <<'NODE'
          const valid=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'').trim().toLowerCase());
          if(!valid('test@example.com') || !valid('karcen+shop@gmail.com') || valid('not-an-email')) process.exit(1);
          NODE
      - name: Verify update markers
        run: grep -q 'PRINTBOOK_BUILD="5.13.1"' app.js && grep -q 'function isValidCustomerEmail' app.js && grep -q 'Array.isArray(o?.line_items)' app.js
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix cart email validation and multi-item stock checks"
          git push

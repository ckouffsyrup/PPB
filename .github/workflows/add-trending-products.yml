name: Add Trending Products

on:
  push:
    paths:
      - '.github/workflows/add-trending-products.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PrintBook 5.12.0 update
        run: python .github/scripts/update_512.py
      - name: Validate JavaScript
        run: node --check app.js && node --check sw.js
      - name: Verify update markers
        run: grep -q 'productTrendStats' app.js && grep -q 'dashboardTrendingProducts' index.html && grep -q 'v5.12.0' storefront-v55.css
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html storefront-v55.css sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Add Trending Products dashboard"
          git push

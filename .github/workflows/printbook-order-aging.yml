name: Apply PrintBook order aging update

on:
  push:
    paths:
      - '.github/workflows/printbook-order-aging.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply order aging patch
        run: python scripts/apply_order_aging.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit update
        run: |
          git config user.name "PrintBook Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js storefront-v55.css
          git diff --cached --quiet && exit 0
          git commit -m "Add order aging badges"
          git push

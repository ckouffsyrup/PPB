name: Apply PrintBook order aging update

on:
  push:
    paths:
      - '.github/workflows/printbook-order-aging.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add order aging badges
        shell: python
        run: |
          from pathlib import Path
          import re

          app_path = Path('app.js')
          css_path = Path('storefront-v55.css')
          app = app_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          marker = 'function orderAgeDays(order)'
          if marker not in app:
              anchor = 'const ORDER_STATUS_META='
              pos = app.find(anchor)
              if pos < 0:
                  raise SystemExit('ORDER_STATUS_META not found')
              semi = app.find(';', pos)
              helper = r'''
function orderAgeDays(order){
  const raw=order?.updated_at||order?.created_at;
  if(!raw)return 0;
  const t=new Date(raw).getTime();
  if(!Number.isFinite(t))return 0;
  return Math.max(0,Math.floor((Date.now()-t)/86400000));
}
function orderAgeLabel(order){
  const days=orderAgeDays(order);
  const status=String(order?.status||"Requested");
  if(status==="Completed"||status==="Cancelled")return "";
  if(status==="Requested")return days>0?`Waiting ${days}d`:"New today";
  if(status==="Quoted")return days>0?`Quoted ${days}d ago`:"Quoted today";
  if(status==="Accepted")return days>0?`Accepted ${days}d ago`:"Accepted today";
  if(status==="Approved")return days>0?`Approved ${days}d ago`:"Approved today";
  if(status==="Printing")return days>0?`Printing ${days}d`:"Printing today";
  if(status==="Ready")return days>0?`Ready ${days}d`:"Ready today";
  return days>0?`${days}d`:"Today";
}
function orderAgeBadge(order){
  const label=orderAgeLabel(order);
  if(!label)return "";
  const days=orderAgeDays(order);
  const urgency=days>=7?"age-overdue":days>=3?"age-warn":"age-fresh";
  return `<span class="order-age-badge ${urgency}" title="${safe(label)}">${safe(label)}</span>`;
}
'''
              app = app[:semi+1] + helper + app[semi+1:]

          # Insert beside status labels in the two order-card render paths.
          if app.count('${orderAgeBadge(o)}') < 2:
              hits = list(re.finditer(r'\$\{safe\(o\.status\)\}', app))
              inserted = 0
              for m in reversed(hits):
                  context = app[max(0,m.start()-450):m.start()+450].lower()
                  if 'order' in context and ('status' in context or 'tone-border' in context):
                      app = app[:m.end()] + '${orderAgeBadge(o)}' + app[m.end():]
                      inserted += 1
                      if inserted >= 2:
                          break
              if inserted < 2:
                  raise SystemExit(f'Could only find {inserted} order status render locations')

          css_marker = '/* PrintBook order aging badges */'
          if css_marker not in css:
              css += r'''

/* PrintBook order aging badges */
.order-age-badge{
  display:inline-flex;align-items:center;min-height:22px;padding:3px 7px;
  border-radius:999px;border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.035);color:rgba(255,255,255,.62);
  font-size:10px;font-weight:700;line-height:1;white-space:nowrap;vertical-align:middle;
}
.order-age-badge.age-warn{border-color:rgba(245,158,11,.18);background:rgba(245,158,11,.07);color:rgba(253,186,116,.9)}
.order-age-badge.age-overdue{border-color:rgba(248,113,113,.20);background:rgba(248,113,113,.07);color:rgba(252,165,165,.92)}
@media(max-width:720px){.order-age-badge{font-size:9px;min-height:20px;padding:3px 6px}}
'''

          app_path.write_text(app, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit update
        run: |
          git config user.name "PrintBook Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js storefront-v55.css
          git diff --cached --quiet && exit 0
          git commit -m "Add order aging badges"
          git push

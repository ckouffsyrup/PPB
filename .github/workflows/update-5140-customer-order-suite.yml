name: PrintBook 5.14 customer order suite
on:
  push:
    paths: ['.github/workflows/update-5140-customer-order-suite.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/update_5140_customer_order_suite.py
      - name: Validate JS
        run: node --check app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js storefront-v55.css sw.js
          git commit -m "PrintBook 5.14 customer order suite"
          git push
# retry 2

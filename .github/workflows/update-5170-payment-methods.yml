name: PrintBook 5.17 payment methods
on:
  push:
    paths: ['.github/workflows/update-5170-payment-methods.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/update_5170_payment_methods.py
      - name: Validate JS
        run: node --check app.js
      - name: Verify payment method UI
        run: |
          grep -q 'savePaymentMethods' app.js
          grep -q 'payment_cashapp_enabled' index.html
          grep -q 'orderPaymentMethodChoices' index.html
          grep -q 'PRINTBOOK_BUILD="5.17.0"' app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html storefront-v55.css sw.js
          git commit -m "PrintBook 5.17 payment methods"
          git push
# retry after settings marker fix

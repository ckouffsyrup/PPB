name: PrintBook Today and badges update

on:
  push:
    paths:
      - '.github/workflows/printbook-today-badges.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        run: python3 .github/scripts/update_511.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js
      - name: Commit update
        run: |
          git config user.name "PrintBook Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html storefront-v55.css sw.js
          git commit -m "Add Today workspace and automatic storefront badges"
          git push

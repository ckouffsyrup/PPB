name: PrintBook Today workspace and storefront badges

on:
  push:
    paths:
      - '.github/workflows/printbook-today-badges.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PrintBook 5.11.0 update
        shell: python
        run: |
          from pathlib import Path

          app_p=Path('app.js'); idx_p=Path('index.html'); css_p=Path('storefront-v55.css'); sw_p=Path('sw.js')
          app=app_p.read_text(); idx=idx_p.read_text(); css=css_p.read_text(); sw=sw_p.read_text()

          # ---- automatic storefront badges ----
          anchor='function storefrontProductCardHTML(i,{featured=false}={}){'
          helpers=r'''function storefrontProductBadges(i){
            if(!customerMode)return "";
            const badges=[];
            const created=Date.parse(i?.created_at||"");
            const ageDays=Number.isFinite(created)?Math.max(0,Math.floor((Date.now()-created)/86400000)):9999;
            const sold=Math.max(0,Number(i?.sold_qty||0));
            const stock=itemStock(i);
            if(ageDays<=14)badges.push('<span class="store-product-badge badge-new">NEW</span>');
            if(sold>=3)badges.push('<span class="store-product-badge badge-popular">POPULAR</span>');
            if(!isMadeToOrder(i)&&stock>0&&stock<=2)badges.push('<span class="store-product-badge badge-limited">LIMITED</span>');
            return badges.length?`<div class="store-product-badges">${badges.join("")}</div>`:"";
          }
          '''
          if helpers.strip() not in app:
            app=app.replace(anchor,helpers+anchor,1)
          photo='''    <div class="shop-card-photo">\n      ${i.photo_url?`<img data-product-image="${safe(i.id)}" src="${safe(i.photo_url)}" alt="${safe(i.name)}">`:`<div class="photo-fallback">KP</div>`}'''
          photo_new='''    <div class="shop-card-photo">\n      ${i.photo_url?`<img data-product-image="${safe(i.id)}" src="${safe(i.photo_url)}" alt="${safe(i.name)}">`:`<div class="photo-fallback">KP</div>`}\n      ${storefrontProductBadges(i)}'''
          if photo in app: app=app.replace(photo,photo_new,1)

          # ---- Today workspace markup ----
          dash='''      <section class="dashboard-kpis">'''
          today='''      <section class="today-workspace" id="todayWorkspace">
            <div class="today-head">
              <div><p class="eyebrow">TODAY</p><h3 id="todayGreeting">Your shop today</h3><p id="todaySummary" class="muted">Loading your day…</p></div>
              <span class="today-date" id="todayDate"></span>
            </div>
            <div class="today-stat-grid">
              <button type="button" data-go="orders"><strong id="todayActiveOrders">0</strong><span>Active orders</span></button>
              <button type="button" onclick="goToOrdersStatus('Requested')"><strong id="todayNeedQuotes">0</strong><span>Need quotes</span></button>
              <button type="button" onclick="goToOrdersStatus('Printing')"><strong id="todayPrinting">0</strong><span>Printing</span></button>
              <button type="button" onclick="goToOrdersStatus('Ready')"><strong id="todayReady">0</strong><span>Ready</span></button>
              <div><strong id="todayRevenue">$0</strong><span>Revenue today</span></div>
              <div><strong id="todayCompleted">0</strong><span>Completed today</span></div>
            </div>
            <div class="today-focus-grid">
              <button class="today-focus-card" id="todayNextPrint" type="button" data-go="orders"><small>PRINT NEXT</small><strong>Queue is clear</strong><span>No production waiting.</span></button>
              <button class="today-focus-card" id="todayLongestWait" type="button" data-go="orders"><small>WAITING LONGEST</small><strong>Nobody waiting</strong><span>You're caught up.</span></button>
              <button class="today-focus-card" id="todayLowStock" type="button" data-go="filaments"><small>INVENTORY WATCH</small><strong>Stock looks good</strong><span>No low filament.</span></button>
            </div>
          </section>
'''
          if 'id="todayWorkspace"' not in idx: idx=idx.replace(dash,today+dash,1)

          # ---- Today workspace data ----
          dash_fn='function renderDashboard(){'
          today_fn=r'''function renderTodayWorkspace(){
            if(!$('todayWorkspace'))return;
            const now=new Date(),today=now.toISOString().slice(0,10),hour=now.getHours();
            const greeting=hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';
            const active=orders.filter(o=>!["Completed","Cancelled"].includes(o.status));
            const requested=active.filter(o=>o.status==='Requested');
            const printing=active.filter(o=>o.status==='Printing');
            const ready=active.filter(o=>o.status==='Ready');
            const completedToday=orders.filter(o=>o.status==='Completed'&&String(o.updated_at||'').slice(0,10)===today);
            const tx=dashboardTransactions().filter(t=>String(t.date||'').slice(0,10)===today);
            const revenue=tx.reduce((sum,t)=>sum+Number(t.amount||0),0);
            $('todayGreeting').textContent=`${greeting}. Here's the shop.`;
            $('todayDate').textContent=now.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
            $('todayActiveOrders').textContent=active.length;
            $('todayNeedQuotes').textContent=requested.length;
            $('todayPrinting').textContent=printing.length;
            $('todayReady').textContent=ready.length;
            $('todayRevenue').textContent=money(revenue);
            $('todayCompleted').textContent=completedToday.length;
            const bits=[];
            if(requested.length)bits.push(`${requested.length} need${requested.length===1?'s':''} a quote`);
            if(printing.length)bits.push(`${printing.length} printing`);
            if(ready.length)bits.push(`${ready.length} ready`);
            $('todaySummary').textContent=bits.length?bits.join(' · '):active.length?`${active.length} active order${active.length===1?'':'s'} · nothing urgent`:'Everything is caught up.';

            const production=active.filter(o=>['Approved','Printing'].includes(o.status)).sort((a,b)=>(a.status==='Printing'?-1:0)-(b.status==='Printing'?-1:0)||String(a.due_date||'9999').localeCompare(String(b.due_date||'9999'))||Date.parse(a.created_at||0)-Date.parse(b.created_at||0));
            const next=production[0],nextCard=$('todayNextPrint');
            if(next){nextCard.querySelector('strong').textContent=`${next.item||'Custom order'} ×${Math.max(1,Number(next.quantity||1))}`;nextCard.querySelector('span').textContent=`${next.customer||'Customer'} · ${next.status}${next.due_date?` · due ${next.due_date}`:''}`;nextCard.onclick=()=>openOrder(next.id)}
            else{nextCard.querySelector('strong').textContent='Queue is clear';nextCard.querySelector('span').textContent='No approved or printing jobs waiting.';nextCard.onclick=()=>showView('orders')}

            const waiting=[...active].sort((a,b)=>Date.parse(a.created_at||0)-Date.parse(b.created_at||0))[0],waitCard=$('todayLongestWait');
            if(waiting){const days=Math.max(0,Math.floor((Date.now()-Date.parse(waiting.created_at||Date.now()))/86400000));waitCard.querySelector('strong').textContent=waiting.item||'Custom order';waitCard.querySelector('span').textContent=`${waiting.customer||'Customer'} · ${waiting.status}${days?` · ${days}d waiting`:''}`;waitCard.onclick=()=>openOrder(waiting.id)}
            else{waitCard.querySelector('strong').textContent='Nobody waiting';waitCard.querySelector('span').textContent="You're caught up.";waitCard.onclick=()=>showView('orders')}

            const low=restockSuggestions()[0],lowCard=$('todayLowStock');
            if(low){lowCard.querySelector('strong').textContent=`${low.f.color||low.f.material||'Filament'} is low`;lowCard.querySelector('span').textContent=`${Math.round(low.f.remaining||0)}g left${low.units!=null?` · ~${low.units} prints`:''}`}
            else{lowCard.querySelector('strong').textContent='Stock looks good';lowCard.querySelector('span').textContent='No low filament right now.'}
          }
          '''
          if today_fn.strip() not in app: app=app.replace(dash_fn,today_fn+dash_fn,1)
          render_line='''function renderDashboard(){\n  const tx=dashboardTransactions()'''
          render_new='''function renderDashboard(){\n  renderTodayWorkspace();\n  const tx=dashboardTransactions()'''
          if render_line in app: app=app.replace(render_line,render_new,1)

          # Version
          app=app.replace('window.PRINTBOOK_BUILD="5.10.3"','window.PRINTBOOK_BUILD="5.11.0"',1)
          idx=idx.replace('storefront-v55.css?v=5.10.0','storefront-v55.css?v=5.11.0',1)
          sw=sw.replace('printbook-v5.10.0-mobile-public-order-fix','printbook-v5.11.0-today-badges')

          css += r'''

          /* PrintBook v5.11.0 — automatic storefront badges + Today workspace */
          .store-product-badges{position:absolute;left:10px;top:10px;z-index:4;display:flex;gap:5px;flex-wrap:wrap;max-width:72%}
          .store-product-badge{display:inline-flex;align-items:center;min-height:23px;padding:0 8px;border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.08em;backdrop-filter:blur(10px);box-shadow:0 5px 16px rgba(0,0,0,.18)}
          .store-product-badge.badge-new{color:#dbeafe;background:rgba(37,99,235,.78);border:1px solid rgba(147,197,253,.28)}
          .store-product-badge.badge-popular{color:#fff7ed;background:rgba(234,88,12,.80);border:1px solid rgba(253,186,116,.28)}
          .store-product-badge.badge-limited{color:#fef3c7;background:rgba(161,98,7,.82);border:1px solid rgba(252,211,77,.28)}

          .today-workspace{margin:0 0 16px;padding:18px;border:1px solid rgba(139,92,246,.17);border-radius:20px;background:radial-gradient(circle at 90% 0,rgba(139,92,246,.10),transparent 34%),linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));box-shadow:0 16px 42px rgba(0,0,0,.14)}
          .today-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}.today-head h3{margin:2px 0 4px;font-size:20px}.today-date{font-size:10px;font-weight:800;color:rgba(255,255,255,.42);padding:7px 9px;border:1px solid rgba(255,255,255,.06);border-radius:999px;white-space:nowrap}
          .today-stat-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin-bottom:9px}.today-stat-grid>button,.today-stat-grid>div{appearance:none;text-align:left;color:inherit;padding:11px;border:1px solid rgba(255,255,255,.055);border-radius:13px;background:rgba(0,0,0,.10)}.today-stat-grid>button{cursor:pointer}.today-stat-grid>button:hover{background:rgba(255,255,255,.025)}.today-stat-grid strong,.today-stat-grid span{display:block}.today-stat-grid strong{font-size:18px}.today-stat-grid span{margin-top:3px;font-size:9px;color:rgba(255,255,255,.4)}
          .today-focus-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.today-focus-card{appearance:none;width:100%;text-align:left;color:inherit;padding:12px;border:1px solid rgba(255,255,255,.055);border-radius:13px;background:rgba(0,0,0,.08);cursor:pointer}.today-focus-card:hover{border-color:rgba(139,92,246,.2);background:rgba(139,92,246,.035)}.today-focus-card small,.today-focus-card strong,.today-focus-card span{display:block}.today-focus-card small{font-size:8px;font-weight:900;letter-spacing:.12em;color:#a78bfa}.today-focus-card strong{margin-top:5px;font-size:12px}.today-focus-card span{margin-top:3px;font-size:9px;line-height:1.35;color:rgba(255,255,255,.4)}
          @media(max-width:800px){.today-stat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.today-focus-grid{grid-template-columns:1fr}}
          @media(max-width:430px){.today-workspace{padding:14px;border-radius:17px}.today-head h3{font-size:17px}.today-stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.today-stat-grid strong{font-size:16px}.store-product-badge{font-size:8px;min-height:21px;padding:0 7px}}
          '''

          app_p.write_text(app); idx_p.write_text(idx); css_p.write_text(css); sw_p.write_text(sw)
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js
      - name: Commit update
        run: |
          git config user.name "PrintBook Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html storefront-v55.css sw.js
          git commit -m "Add Today workspace and automatic storefront badges"
          git push

name: PrintBook multi-item orders

on:
  push:
    paths:
      - '.github/workflows/update-513-multi-item-orders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PrintBook 5.13.0 update
        run: python .github/scripts/update_513_multi_item_orders.py
      - name: Validate JavaScript
        run: node --check app.js && node --check sw.js
      - name: Verify update markers
        run: |
          grep -q 'customerOrderCart' app.js
          grep -q 'customerCartDialog' index.html
          grep -q 'orderLineItemsPanel' index.html
          grep -q 'v5.13.0' storefront-v55.css
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html storefront-v55.css sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Add multi-item customer orders"
          git push

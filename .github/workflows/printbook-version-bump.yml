name: One-time PrintBook version bump

on:
  push:
    paths:
      - '.github/workflows/printbook-version-bump.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update internal build number
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('window.PRINTBOOK_BUILD="5.7.2";','window.PRINTBOOK_BUILD="5.10.2";')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate app.js
        run: node --check app.js
      - name: Commit version bump
        run: |
          git config user.name "PrintBook Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Bump PrintBook build to 5.10.2"
          git push

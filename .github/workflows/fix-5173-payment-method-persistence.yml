name: PrintBook 5.17.3 payment method persistence
on:
  push:
    paths: ['.github/workflows/fix-5173-payment-method-persistence.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_5173_payment_method_persistence.py
      - name: Validate JS
        run: node --check app.js
      - name: Safety checks
        run: |
          grep -q 'PRINTBOOK_BUILD="5.17.3"' app.js
          grep -q 'ensurePaymentMethodsLoaded' app.js
          grep -q '<!-- SETTINGS -->' index.html
          test $(wc -c < index.html) -gt 30000
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js
          git commit -m "Fix saved payment methods loading in orders"
          git push

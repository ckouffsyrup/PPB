name: Apply request dialog redesign
on: [push]
permissions:
  contents: write
jobs:
  rewrite:
    if: contains(github.event.head_commit.message, 'Simplify request dialog rewrite workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/apply_request_redesign.py
      - run: |
          git config user.name "PrintBook UI updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Redesign hardcoded customer request dialog UI" || exit 0
          git push

name: Fix storefront badge overlap

on:
  push:
    paths:
      - '.github/workflows/fix-store-badge-overlap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PrintBook 5.11.1 badge spacing fix
        shell: python
        run: |
          from pathlib import Path

          css_p=Path('storefront-v55.css')
          app_p=Path('app.js')
          sw_p=Path('sw.js')
          css=css_p.read_text()
          app=app_p.read_text()
          sw=sw_p.read_text()

          marker='/* PrintBook v5.11.1 — prevent storefront badge overlap */'
          if marker not in css:
              css += '''\n\n/* PrintBook v5.11.1 — prevent storefront badge overlap */\n.shop-card-photo:has(.store-product-badges) > .out-badge{\n  top:40px!important;\n}\n@media(max-width:430px){\n  .shop-card-photo:has(.store-product-badges) > .out-badge{top:37px!important}\n}\n'''

          app=app.replace('window.PRINTBOOK_BUILD="5.11.0"','window.PRINTBOOK_BUILD="5.11.1"')
          sw=sw.replace('const CACHE="printbook-v5.10.3-favicon-refresh";','const CACHE="printbook-v5.11.1-badge-overlap";')

          css_p.write_text(css)
          app_p.write_text(app)
          sw_p.write_text(sw)
      - name: Validate JavaScript
        run: node --check app.js && node --check sw.js
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js storefront-v55.css sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix storefront badge overlap"
          git push

name: Refresh PrintBook favicon references

on:
  push:
    paths:
      - '.github/workflows/printbook-favicon-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh favicon references and build
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          app = Path('app.js')
          sw = Path('sw.js')

          it = index.read_text(encoding='utf-8')
          it = it.replace('href="assets/icon.svg" type="image/svg+xml"', 'href="assets/icon.svg?v=3" type="image/svg+xml"')
          it = it.replace('href="assets/icon-180.png"', 'href="assets/icon.svg?v=3"')
          index.write_text(it, encoding='utf-8')

          at = app.read_text(encoding='utf-8')
          at = at.replace('window.PRINTBOOK_BUILD="5.10.2"', 'window.PRINTBOOK_BUILD="5.10.3"')
          app.write_text(at, encoding='utf-8')

          st = sw.read_text(encoding='utf-8')
          first = st.splitlines()[0]
          st = st.replace(first, 'const CACHE="printbook-v5.10.3-favicon-refresh";', 1)
          sw.write_text(st, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check app.js && node --check sw.js
      - name: Commit update
        run: |
          git config user.name "PrintBook Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Use refreshed KP favicon everywhere"
          git push

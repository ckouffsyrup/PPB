<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Karcen's Prints KP logo">
  <defs>
    <radialGradient id="bg" cx="48%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a2858"/>
      <stop offset="0.62" stop-color="#2c1f46"/>
      <stop offset="1" stop-color="#24193b"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="34%" r="70%">
      <stop offset="0" stop-color="#21182f"/>
      <stop offset="0.34" stop-color="#16111f"/>
      <stop offset="0.72" stop-color="#0d0a12"/>
      <stop offset="1" stop-color="#08060b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="214" fill="url(#orb)"/>
  <circle cx="256" cy="214" r="150" fill="url(#glow)" filter="url(#softGlow)"/>

  <g transform="rotate(-4 256 256) skewX(-7)">
    <text x="256" y="292"
      text-anchor="middle"
      font-family="Arial Black, Arial, Helvetica, sans-serif"
      font-size="154"
      font-style="italic"
      font-weight="900"
      letter-spacing="-18"
      fill="#ffffff">KP</text>
  </g>
</svg>

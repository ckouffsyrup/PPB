<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PrintBook Push Secret Generator</title>
<style>
body{font:16px system-ui;background:#111;color:#eee;max-width:800px;margin:40px auto;padding:20px}
button{padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-all;background:#1d1d1d;padding:16px;border-radius:12px}
.warn{color:#ffb4b4}
</style>
<h1>PrintBook Push Secret Generator</h1>
<p>This runs entirely in your browser. Nothing is uploaded anywhere.</p>
<p class="warn"><strong>Never put the generated PRIVATE key or CRON secret in GitHub.</strong></p>
<button id="go">Generate push secrets</button>
<pre id="out">Click Generate.</pre>
<script type="module">
const enc=b=>btoa(String.fromCharCode(...b)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
document.getElementById("go").onclick=async()=>{
  const pair=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);
  const pub=await crypto.subtle.exportKey("raw",pair.publicKey);
  const priv=await crypto.subtle.exportKey("pkcs8",pair.privateKey);
  const cron=new Uint8Array(32);crypto.getRandomValues(cron);
  document.getElementById("out").textContent=
`VAPID_PUBLIC_KEY=${enc(new Uint8Array(pub))}
VAPID_PRIVATE_KEY=${enc(new Uint8Array(priv))}
PUSH_CRON_SECRET=${enc(cron)}

You still need:
VAPID_SUBJECT=mailto:YOUR_EMAIL@example.com

Paste these into Supabase → Edge Functions → Secrets.
Do NOT upload the generated values to GitHub.`;
};
</script>
